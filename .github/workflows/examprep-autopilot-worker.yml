name: ExamPrep AutoPilot Worker

on:
  schedule:
    # GitHub Actions can invoke the protected production worker more often than
    # Vercel Hobby Cron permits. GitHub scheduled runs are best-effort.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examprep-autopilot-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke protected production worker
        shell: bash
        env:
          WORKER_URL: https://exam-prep-direct-box.vercel.app/api/automation/worker
          CRON_SECRET: ${{ secrets.EXAMPREP_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::warning::Set the GitHub Actions secret EXAMPREP_CRON_SECRET to the same value as the Vercel production CRON_SECRET. No request was sent."
            exit 0
          fi

          response_file="${RUNNER_TEMP}/examprep-worker-response.json"
          http_status="$(curl --silent --show-error --output "${response_file}" --write-out "%{http_code}" --connect-timeout 10 --max-time 60 --header "Authorization: Bearer ${CRON_SECRET}" "${WORKER_URL}")"
          if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
            echo "ExamPrep worker returned HTTP ${http_status}."
            exit 1
          fi
          echo "ExamPrep worker responded with HTTP ${http_status}."

name: ExamPrep Production E2E Smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "tests/e2e/**"
      - "scripts/**"
      - ".github/workflows/production-e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or preview URL to test"
        required: false
        default: "https://exam-prep-direct-box.vercel.app"
        type: string

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url != '' && inputs.base_url || 'https://exam-prep-direct-box.vercel.app' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright for this run only
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare diagnostics directory
        run: mkdir -p test-results

      - name: Run production/mobile smoke tests
        run: npx playwright test tests/e2e/production-smoke.spec.mjs --reporter=line

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examprep-production-smoke-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

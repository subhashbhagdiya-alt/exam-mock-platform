name: ExamPrep CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run lint
      - run: npm run test:result-validation
      - run: npm run test:mfa-assurance
      - run: npm run test:weekly-exam-analysis
      - run: npm run test:paper-analysis-quiz
      - run: npm run test:paper-analysis-upload
      - run: npm run check:localizations
      - run: npm run build

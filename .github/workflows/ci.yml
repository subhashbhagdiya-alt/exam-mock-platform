name: ExamPrep CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run lint
      - run: npm run test:result-validation
      - run: npm run test:mfa-assurance
      - run: npm run test:background-task-retry
      - run: npm run test:weekly-exam-analysis
      - run: npm run test:paper-analysis-quiz
      - run: npm run test:paper-analysis-upload
      - run: npm run check:localizations
      - run: npm run build
      - name: Install temporary Playwright runner for this PR's mobile preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-exam-picker-sync-2026-10-22'
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium for this PR's mobile preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-exam-picker-sync-2026-10-22'
        run: npx playwright install --with-deps chromium
      - name: Wait for the latest mobile preview build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-exam-picker-sync-2026-10-22'
        env:
          E2E_BASE_URL: https://exam-prep-git-fix-home-exam-picker-sync-2026-10-22-direct-box.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            page="$(curl --fail --silent --show-error "$E2E_BASE_URL/" 2>/dev/null || true)"
            if printf '%s' "$page" | grep -q 'data-testid="mobile-nav-home"'; then
              echo "The branch preview contains the current mobile navigation build."
              exit 0
            fi
            echo "Preview build not updated yet (attempt $attempt/36)."
            sleep 5
          done
          echo "Timed out waiting for the current branch preview."
          exit 1
      - name: Run real mobile browser smoke tests on the PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-exam-picker-sync-2026-10-22'
        env:
          E2E_BASE_URL: https://exam-prep-git-fix-home-exam-picker-sync-2026-10-22-direct-box.vercel.app
          E2E_SKIP_PRIVILEGED_API_TESTS: "true"
        run: npx playwright test tests/e2e/production-smoke.spec.mjs --reporter=list
      - name: Upload mobile browser screenshots and diagnostics
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-exam-picker-sync-2026-10-22'
        uses: actions/upload-artifact@v4
        with:
          name: examprep-pr-mobile-smoke-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

name: Background Manager Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-prep-background-worker
  cancel-in-progress: false

jobs:
  process-queued-work:
    runs-on: ubuntu-latest
    # Two bounded worker invocations help complete generation/review phases
    # sooner while staying well below each Gemini/Vercel request timeout.
    timeout-minutes: 5
    steps:
      - name: Check worker secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is missing. Add the same value as the Vercel ExamPrep CRON_SECRET; do not paste it into code or logs."
            exit 1
          fi
      - name: Process up to two queued phases
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          for attempt in 1 2; do
            code="$(curl --silent --show-error --max-time 70 \
              --output worker-response.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header 'Accept: application/json' \
              'https://exam-prep-direct-box.vercel.app/api/automation/worker')"
            cat worker-response.json
            echo
            case "$code" in
              200|202) echo "Worker accepted invocation $attempt (HTTP $code)." ;;
              *) echo "::error::Worker returned HTTP $code."; exit 1 ;;
            esac

            # Quota/timeouts return a retry message. Do not hammer the free-tier
            # provider immediately; defer to the next scheduled run instead.
            retry="$(jq -r '.retry // empty' worker-response.json)"
            processed="$(jq -r '.processed // false' worker-response.json)"
            if [ -n "$retry" ] || [ "$processed" != "true" ]; then
              echo "Stopping after invocation $attempt; worker requested a defer or has no eligible task."
              break
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Task progressed; attempting one more queue phase in this run."
            fi
          done
